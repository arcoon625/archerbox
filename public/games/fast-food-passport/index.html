<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Fast Food Shift · Archerbox</title>
 <link rel="stylesheet" href="style.css?v=shift1">
</head>
<body>
 <main id="selection" class="selection">
  <div class="hero">
   <h1>Fast Food <em>Shift</em></h1>
   <p>Take orders, make the food, and earn tips from your customers.</p>
  </div>
  <section class="chooser" aria-labelledby="chooseTitle">
   <h2 id="chooseTitle">Choose a restaurant</h2>
   <div id="restaurants"></div>
  </section>
 </main>
 <main id="work" class="work" hidden>
  <header class="top">
   <button type="button" id="leave">← Restaurants</button>
   <div><h1 id="shopName"></h1><p id="shiftProgress"></p></div>
   <div class="tips"><span>TIPS</span><b id="tips">$0</b></div>
  </header>
  <div class="layout">
   <section class="floor" aria-label="Restaurant kitchen">
    <div class="view"><canvas id="world" aria-label="First-person kitchen view. Drag to look around." role="img" tabindex="0"></canvas></div>
    <div class="toolbar">
     <div class="dpad" aria-label="Walk">
      <button type="button" data-move="up" aria-label="Walk forward">↑</button>
      <button type="button" data-move="left" aria-label="Step left">←</button>
      <button type="button" data-move="down" aria-label="Walk backward">↓</button>
      <button type="button" data-move="right" aria-label="Step right">→</button>
     </div>
     <p id="hint">Drag to look. Use WASD to walk.</p>
     <button id="interact" class="primary" type="button" disabled>Interact <kbd>E</kbd></button>
    </div>
   </section>
   <aside class="ticket">
    <div class="ticketHeading"><div><h2>Order ticket</h2><p id="customerName"></p></div><b id="orderNumber"></b></div>
    <div id="order"></div>
    <section class="stations" aria-label="Go to a station">
     <button type="button" data-go="counter"><b>Order & Pickup</b><small>Take or serve an order</small></button>
     <button type="button" data-go="prep"><b>Prep Station</b><small>Add ingredients and pack</small></button>
     <button type="button" data-go="cook"><b>Cooking Station</b><small>Grill, fry, or bake</small></button>
    </section>
    <p id="workNotice" role="status"></p>
   </aside>
  </div>
 </main>
 <dialog id="stationDialog" aria-labelledby="stationHeading">
  <button class="close" type="button" id="closeStation" aria-label="Close station" autofocus>×</button>
  <h2 id="stationHeading"></h2>
  <div id="stationBody"></div>
  <p id="stationNotice" role="status"></p>
 </dialog>
 <dialog id="summary" aria-labelledby="summaryTitle">
  <h2 id="summaryTitle">Shift complete!</h2>
  <p id="summaryText"></p>
  <div id="summaryStats"></div>
  <div class="actions"><button type="button" class="primary" id="again">Start a new shift</button><button type="button" id="chooseAgain">Choose a restaurant</button></div>
 </dialog>
 <script type="module" src="game.js?v=shift1"></script>
 <script type="module" src="../../bridge.js"></script>
</body>
</html>
